<!DOCTYPE html>
<html lang="en">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
English with Olya Admin
</title>


<link rel="stylesheet" href="admin.css">


</head>



<body>



<div class="admin-box">



<h1>
ENGLISH WITH OLYA
</h1>



<h2>
MAGAZINE ADMIN PANEL
</h2>




<div class="line"></div>





<label>
PAGE IMAGE
</label>



<div class="upload-box">



<label 
for="image" 
class="upload-label">


<div class="upload-icon">

+

</div>



<div class="upload-text">


<strong>
UPLOAD PAGE IMAGE
</strong>


<span>
JPG, PNG, WEBP
</span>


</div>



</label>



<input 
type="file"
id="image"
accept="image/*"
hidden>



</div>






<div class="preview-box">


<img 
id="preview"
src=""
alt="">


</div>







<label>
PAGE TITLE
</label>


<input
type="text"
id="page-title"
placeholder="Example: Taylor Swift">






<label>
PAGE NUMBER
</label>


<input
type="number"
id="page-number"
placeholder="04">






<button id="save-page">

SAVE PAGE

</button>






</div>







<script src="admin.js"></script>



</body>


</html>
